# 휴관일 상세(detailIntro2) 정적 스냅샷 주간 갱신.
#
# 매주 월·화 KST 03:00(= 일·월 18:00 UTC) — Vercel 크론(/api/warm, KST 00:00)이 그날 런타임 회전(≤150)을
# 먼저 쓰고 난 뒤다. 수집기는 실행당 ≤800 요청(같은 키의 일일 쿼터 1,000/op 를 나눠 씀)이라 전량(≈1,680)
# 을 --force 로 갱신하려면 이틀이 필요하다: 가장 오래 받은 것부터 골라 월요일 800 + 화요일 나머지.
# 일일 쿼터(code 22)를 만나면 그때까지의 결과를 저장하고 정상 종료한다(다음 실행이 이어감).
#
# 변경이 있으면 data/intros.json 을 커밋·푸시한다 → Vercel git 연동이면 자동 배포.
# 시크릿(값은 여기 두지 않는다): DATA_GO_KR_KEY — data.go.kr **Encoding** 키(.env.example 참조).
name: collect-intros

on:
  schedule:
    - cron: '0 18 * * 0,1' # KST 월·화 03:00 — 전량(--force)
    - cron: '0 18 * * 2-6' # KST 수~일 03:00 — 빠진 id 만(전량이 차 있으면 요청 0)
  workflow_dispatch:
    inputs:
      force:
        description: '전량 갱신(--force). 끄면 스냅샷에 없는 id 만 수집.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect-intros
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect detailIntro2 snapshot
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)
          if { [ "${{ github.event_name }}" = "schedule" ] && { [ "$DOW" = "1" ] || [ "$DOW" = "2" ]; }; } || [ "${{ inputs.force }}" = "true" ]; then
            npm run collect:intros -- --force
          else
            npm run collect:intros
          fi

      - name: Verify snapshot still parses and tests pass
        run: |
          node -e "const s=require('./data/intros.json'); if(!s||typeof s.byId!=='object') process.exit(1); console.log('byId:', Object.keys(s.byId).length, 'collectedAt:', s.collectedAt)"
          npm test

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/intros.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intros.json
          COUNT=$(node -e "console.log(Object.keys(require('./data/intros.json').byId).length)")
          git commit -m "chore(data): 휴관일 상세 스냅샷 갱신 (${COUNT}건)"
          git push
